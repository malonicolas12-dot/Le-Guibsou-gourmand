<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>Le Gibsou Gourmand</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:linear-gradient(160deg,#3d1c02,#7a3410,#c4622d,#e8a272);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;user-select:none;}
    h1{color:#ffe5b4;font-size:2rem;margin-bottom:10px;text-shadow:0 0 18px #c4622d,0 2px 4px rgba(0,0,0,.5);letter-spacing:2px;}
    #hud{display:flex;gap:40px;margin-bottom:10px;font-size:1.3rem;color:#ffe5b4;}
    #score-val{color:#ffb347;}#lives-val{color:#ff6b6b;}#level-val{color:#f5deb3;}
    #gameCanvas{border:4px solid #c4622d;border-radius:10px;box-shadow:0 0 30px rgba(196,98,45,.6);background:linear-gradient(180deg,#1a0a02,#2d1205);display:block;touch-action:none;}
    #game-wrap{display:flex;flex-direction:column;align-items:center;width:100%;}
    body{padding:0;}
    #touch-btns{display:none;gap:12px;margin-top:10px;width:100%;}
    #touch-btns button{flex:1;padding:20px 0;font-size:2.2rem;background:rgba(196,98,45,.35);border:2px solid #c4622d;border-radius:16px;color:#ffe5b4;cursor:pointer;user-select:none;-webkit-user-select:none;}
    @media(max-width:520px){#touch-btns{display:flex;}h1{font-size:1.3rem;}#hud{gap:14px;font-size:.95rem;}}
    #controls{margin-top:12px;color:#fff;font-size:1.05rem;text-align:center;font-weight:700;background:rgba(0,0,0,.45);padding:8px 16px;border-radius:20px;letter-spacing:.5px;}
    #overlay{position:fixed;inset:0;background:rgba(40,15,2,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;}
    #overlay h2{font-size:3rem;color:#ffb347;text-shadow:0 0 20px #c4622d;margin-bottom:20px;}
    #overlay p{color:#ffe5b4;font-size:1.3rem;margin-bottom:10px;}
    #overlay button{margin-top:20px;padding:14px 40px;font-size:1.2rem;background:linear-gradient(135deg,#e8a272,#c4622d);border:none;border-radius:30px;cursor:pointer;font-weight:bold;color:#fff8f0;box-shadow:0 4px 20px rgba(196,98,45,.6);transition:transform .1s;}
    #overlay button:hover{transform:scale(1.05);}
    #gibs-loose-over{width:200px;height:200px;object-fit:cover;object-position:center top;border-radius:50%;border:4px solid #c4622d;box-shadow:0 0 30px rgba(196,98,45,.7);margin-bottom:18px;}
    img.sprite{display:none;}
    .hidden{display:none!important;}
  </style>
</head>

<script>

// ── Système audio ─────────────────────────────────────────────
let audioCtx = null;
let musicPlaying = false;
let musicNodes = [];
let muted = false;

function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, start, dur, type='sine', vol=0.18, freqEnd=null) {
  if (muted) return;
  const ac = getAC();
  const osc = ac.createOscillator();
  const g   = ac.createGain();
  osc.connect(g); g.connect(ac.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ac.currentTime + start);
  if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, ac.currentTime + start + dur);
  g.gain.setValueAtTime(vol, ac.currentTime + start);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + start + dur);
  osc.start(ac.currentTime + start);
  osc.stop(ac.currentTime + start + dur + 0.01);
}

function soundEat() {
  // Crunch joyeux ascendant
  tone(320, 0,    0.06, 'square', 0.12);
  tone(480, 0.05, 0.06, 'square', 0.12);
  tone(640, 0.10, 0.10, 'square', 0.12);
  tone(880, 0.16, 0.12, 'sine',   0.10);
}

function soundStar() {
  // Son spécial étoile
  tone(520, 0,    0.08, 'sine', 0.15);
  tone(780, 0.06, 0.08, 'sine', 0.15);
  tone(1040,0.12, 0.12, 'sine', 0.15);
  tone(1320,0.20, 0.18, 'sine', 0.12);
}

function soundDisgust() {
  // Beurk descendant
  tone(280, 0,    0.12, 'sawtooth', 0.14, 180);
  tone(180, 0.10, 0.14, 'sawtooth', 0.14, 120);
  tone(120, 0.22, 0.18, 'sawtooth', 0.12, 80);
}

function soundGameOver() {
  // Mélodie triste
  [[440,0],[370,0.28],[330,0.56],[220,0.84]].forEach(([f,t]) => tone(f, t, 0.26, 'sine', 0.18));
}

function soundLevelUp() {
  [330,440,550,660,880].forEach((f,i) => tone(f, i*0.09, 0.14, 'square', 0.10));
}

// ── Musique de fond (mélodie cuisine joyeuse) ─────────────────
const BPM = 136;
const beat = 60 / BPM;

// Notes en Hz
const N = {
  C4:261.6, D4:293.7, E4:329.6, F4:349.2, G4:392.0, A4:440.0, B4:493.9,
  C5:523.3, D5:587.3, E5:659.3, F5:698.5, G5:784.0, A5:880.0,
  G3:196.0, C3:130.8
};

// Mélodie principale (voix haute)
const melody = [
  [N.E4,1],[N.G4,1],[N.A4,1],[N.C5,2],
  [N.A4,1],[N.G4,1],[N.E4,2],
  [N.D4,1],[N.F4,1],[N.G4,1],[N.A4,2],
  [N.G4,1],[N.E4,3],
  [N.C5,1],[N.B4,1],[N.A4,1],[N.G4,2],
  [N.F4,1],[N.G4,1],[N.A4,2],
  [N.E4,1],[N.G4,1],[N.F4,1],[N.E4,1],[N.D4,1],
  [N.C4,4]
];

// Basse (oom-pah)
const bass = [
  [N.C3,1],[N.G3,1],[N.G3,1],[N.G3,1],
  [N.C3,1],[N.G3,1],[N.G3,1],[N.G3,1],
  [N.G3,1],[N.D4,1],[N.D4,1],[N.D4,1],
  [N.C3,1],[N.G3,1],[N.G3,1],[N.G3,1],
  [N.F4,1],[N.C4,1],[N.C4,1],[N.C4,1],
  [N.G3,1],[N.D4,1],[N.D4,1],[N.D4,1],
  [N.C3,1],[N.G3,1],[N.E4,1],[N.G3,1],
  [N.C3,4]
];

function scheduleMelody(startTime) {
  if (muted) return 0;
  const ac = getAC();
  let t = startTime;
  melody.forEach(([freq, beats]) => {
    const dur = beats * beat * 0.82;
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.13, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.01);
    musicNodes.push(osc);
    t += beats * beat;
  });
  return t; // retourne le temps de fin
}

function scheduleBass(startTime) {
  if (muted) return;
  const ac = getAC();
  let t = startTime;
  bass.forEach(([freq, beats]) => {
    const dur = beats * beat * 0.55;
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = 'triangle';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.01);
    musicNodes.push(osc);
    t += beats * beat;
  });
}

let loopTimeout = null;
function startMusic() {
  if (muted) return;
  musicPlaying = true;
  const ac = getAC();
  const loopDur = melody.reduce((s,[,b])=>s+b,0) * beat;

  function scheduleLoop(t) {
    scheduleMelody(t);
    scheduleBass(t);
    loopTimeout = setTimeout(() => scheduleLoop(t + loopDur), (loopDur - 1.5) * 1000);
  }
  scheduleLoop(ac.currentTime + 0.1);
}

function stopMusic() {
  musicPlaying = false;
  clearTimeout(loopTimeout);
  musicNodes.forEach(n => { try { n.stop(); } catch(e){} });
  musicNodes = [];
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ── Responsive canvas ─────────────────────────────────────────
function resizeCanvas() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const ratio = 480 / 600;
  let cw, ch;
  if (vw / vh < ratio) {
    cw = vw - 8;
    ch = cw / ratio;
  } else {
    ch = vh * 0.80;
    cw = ch * ratio;
  }
  canvas.style.width  = Math.floor(cw) + 'px';
  canvas.style.height = Math.floor(ch) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const W = canvas.width, H = canvas.height;

const sNormal  = document.getElementById('s-normal');
const sEat     = document.getElementById('s-eat');
const sDisgust = document.getElementById('s-disgust');
const imgLooseOver = document.getElementById('gibs-loose-over');

// Dimensions du sprite en jeu
const SW = 110, SH = 150;
const CAT_Y  = H - SH + 10;
const CAT_SPEED = 7;

const scoreEl = document.getElementById('score-val');
const livesEl = document.getElementById('lives-val');
const levelEl = document.getElementById('level-val');
const overlay = document.getElementById('overlay');
const oTitle  = document.getElementById('overlay-title');
const oMsg    = document.getElementById('overlay-msg');
const oScore  = document.getElementById('overlay-score');
const oBtn    = document.getElementById('overlay-btn');

let score, lives, level, spawnTimer, speedMult, gameRunning, items, catX;

// ── Highscore ─────────────────────────────────────────────────
let highscore = parseInt(localStorage.getItem('gibs_hs') || '0');
const hsEl = document.getElementById('hs-val');
hsEl.textContent = highscore;

// ── Combo ─────────────────────────────────────────────────────
let combo = 0;
let comboDisplay = 0; // valeur affichée (décroît après)
let comboAlpha  = 0;

// ── Particules ────────────────────────────────────────────────
let particles = [];

function spawnParticles(x, y, colors, count=14) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1,
      size: 4 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.vy += 0.25 * dt;
    p.life -= dt * 0.038;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawCombo(cx) {
  if (comboAlpha <= 0 || comboDisplay < 2) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, comboAlpha);
  const scale = 1 + Math.min(comboDisplay - 1, 5) * 0.15;
  ctx.font = `bold ${Math.round(28 * scale)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Ombre
  ctx.fillStyle = '#000';
  ctx.fillText(`🔥 COMBO x${comboDisplay}!`, cx+2, CAT_Y - SH/2 - 52);
  // Texte
  const hue = Math.min(combo * 20, 60);
  ctx.fillStyle = `hsl(${40+hue},100%,60%)`;
  ctx.fillText(`🔥 COMBO x${comboDisplay}!`, cx, CAT_Y - SH/2 - 54);
  ctx.restore();
}

let eatAnim = 0, disgustAnim = 0;

function updateHUD() {
  scoreEl.textContent = score;
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
  levelEl.textContent = level;
}

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup',   e => { keys[e.key] = false; });

// ── Contrôles tactiles ────────────────────────────────────────
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleTouch(e); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); handleTouch(e); }, { passive: false });
function handleTouch(e) {
  const r   = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const t   = e.touches[0];
  catX = (t.clientX - r.left) * scaleX - SW / 2;
}
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  catX = (e.clientX - r.left) * scaleX - SW / 2;
});

const CROQUETTES = ['🟫','⭐','🐟'];
const VEGGIES    = ['🥦','🥕','🧅','🫑','🥬'];

function spawnItem() {
  const isVeg = Math.random() < 0.35;
  const arr = isVeg ? VEGGIES : CROQUETTES;
  items.push({ x: Math.random()*(W-50)+25, y:-40,
    emoji: arr[Math.floor(Math.random()*arr.length)],
    isVeg, size: isVeg?42:38, speed:(2+Math.random()*2)*speedMult });
}

function startGame() {
  score=0; lives=3; level=1; spawnTimer=0; speedMult=1; items=[];
  catX=W/2-SW/2; gameRunning=true; eatAnim=0; disgustAnim=0; combo=0; comboDisplay=0; comboAlpha=0; particles=[];
  imgLooseOver.classList.add('hidden');
  oScore.classList.add('hidden');
  overlay.classList.add('hidden');
  updateHUD();
  startMusic();
  requestAnimationFrame(loop);
}

function endGame() {
  gameRunning=false;
  stopMusic();
  if(score>highscore){highscore=score;localStorage.setItem('gibs_hs',highscore);hsEl.textContent=highscore;}
  imgLooseOver.classList.remove('hidden');
  oTitle.textContent = '😿 Game Over !';
  oMsg.textContent   = 'Gibs a trop mangé de légumes... il est pas content !';
  oScore.textContent = 'Score final : '+score+' pts'+(score>=highscore?' 🏆 Nouveau record !':'  (Record : '+highscore+')');
  oScore.classList.remove('hidden');
  oBtn.textContent   = 'Rejouer !';
  overlay.classList.remove('hidden');
}

oBtn.addEventListener('click', startGame);

function getSprite() {
  if (eatAnim > 0.1)     return sEat;
  if (disgustAnim > 0.1) return sDisgust;
  return sNormal;
}

function drawGibs(x, y) {
  ctx.save();
  const cx = x + SW/2;

  // Bounce quand mange
  let bounce = 0, scX = 1, scY = 1;
  if (eatAnim > 0) {
    bounce = -Math.sin(eatAnim * Math.PI) * 16;
    scX = 1 + Math.sin(eatAnim * Math.PI) * 0.12;
    scY = 1 - Math.sin(eatAnim * Math.PI) * 0.06;
  }
  if (disgustAnim > 0) {
    // Tremblement
    bounce = Math.sin(disgustAnim * Math.PI * 8) * 5;
  }

  
  // Ombre au sol
  ctx.beginPath();
  ctx.ellipse(cx, y+SH+2, SW*0.45, 7, 0, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill();

  // Sprite
  ctx.translate(cx, y + SH/2 + bounce);
  ctx.scale(scX, scY);
  const sp = getSprite();
  if (sp.complete && sp.naturalWidth > 0) {
    ctx.drawImage(sp, -SW/2, -SH/2, SW, SH);
  }

  // "Miam !" ou "Beurk !"
  if (eatAnim > 0.2) {
    ctx.globalAlpha = Math.min(1, eatAnim);
    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = '#ffd700';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('😋 Miam !', 0, -SH/2 - 20 - (1-eatAnim)*20);
    ctx.globalAlpha = 1;
  }
  if (disgustAnim > 0.2) {
    ctx.globalAlpha = Math.min(1, disgustAnim);
    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = '#aef542';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🤢 Beurk !', 0, -SH/2 - 20 - (1-disgustAnim)*20);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawGround() {
  ctx.fillStyle = '#1a1a40';
  ctx.fillRect(0, H-8, W, 8);
}

let lastTime=0;

function loop(ts) {
  if (!gameRunning) return;
  const dt = Math.min((ts-lastTime)/16.67, 3);
  lastTime = ts;

  if (keys['ArrowLeft']  || keys['a']) catX -= CAT_SPEED*dt;
  if (keys['ArrowRight'] || keys['d']) catX += CAT_SPEED*dt;
  catX = Math.max(-20, Math.min(W-SW+20, catX));

  updateParticles(dt);
  if (comboAlpha > 0) comboAlpha = Math.max(0, comboAlpha - dt*0.018);
  if (eatAnim > 0)     eatAnim     = Math.max(0, eatAnim     - dt*0.04);
  if (disgustAnim > 0) disgustAnim = Math.max(0, disgustAnim - dt*0.035);

  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnItem(); spawnTimer = Math.max(18, 55 - level*3); }

  const nl = Math.floor(score/50)+1;
  if (nl !== level) { level=nl; speedMult=1+(level-1)*0.18; items.forEach(i=>i.speed*=1.05); }

  const cx = catX + SW/2;
  const hitY = CAT_Y + SH*0.25; // zone de la bouche (haut du sprite)

  for (let i=items.length-1; i>=0; i--) {
    const it = items[i];
    it.y += it.speed * dt;
    if (Math.hypot(it.x-cx, it.y-hitY) < 44) {
      items.splice(i, 1);
      if (it.isVeg) {
        lives--; updateHUD(); disgustAnim=1; soundDisgust(); combo=0; comboAlpha=0; spawnParticles(it.x, it.y, ['#5a9a3a','#aef542','#c8f076','#7bc950']);
        if (lives <= 0) { soundGameOver(); endGame(); return; }
      } else {
        combo++;
        comboDisplay = combo;
        comboAlpha = 1;
        const base = it.emoji==='⭐'?5:it.emoji==='🐟'?3:1;
        score += base * Math.max(1, combo);
        updateHUD();
        eatAnim = 1;
        const pcols = it.emoji==='⭐'
          ? ['#ffd700','#fff176','#ffec80','#fff']
          : it.emoji==='🐟'
          ? ['#6ec6f5','#a8d8ff','#b0e0ff','#fff']
          : ['#c4622d','#e8a272','#ffe5b4','#ffb347'];
        spawnParticles(it.x, it.y, pcols);
        if (combo >= 2) soundLevelUp(); else if(it.emoji==='⭐') soundStar(); else soundEat();
      }
      continue;
    }
    if (it.y > H+50) items.splice(i, 1);
  }

  ctx.clearRect(0, 0, W, H);
  drawGround();

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const it of items) {
    ctx.font = it.size+'px serif';
    ctx.globalAlpha=.2; ctx.fillText(it.emoji, it.x+3, it.y+3);
    ctx.globalAlpha=1;  ctx.fillText(it.emoji, it.x, it.y);
  }

  drawParticles();
  drawGibs(catX, CAT_Y);
  drawCombo(catX + SW/2);
  requestAnimationFrame(loop);
}
</script>
</body>
